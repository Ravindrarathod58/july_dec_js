        Operators
            operators are the symbols or keywords which is used to perform the operations on teh operands / values

        Types of operators
            1. Arithmatic Operator
                1. +
                    addition operator used to add two values
                2. -
                    subtraction operator
                3. *
                    multiplication operators
                4. %
                    modulus operators
                5. /
                    Division operator
                6. ++
                    increment operator
                7. --
                    decrement operator

                8. **
                    exponent operator
                    returns the power of left operand raise to right operand
            2. Assingment Operators
                1. =
                    equals 
                2. +=
                    let sum = 10 + 20;
                    let sum += 10; // 20 sum = sum + 20
                3. -=
                4. *=
                5. /=
                8. %=
            3. Comparison Operators
                1. ==
                    loose equality operators
                    this only compares the values

                    console.log(10 == "10"); // 10 == 10


                2. !=
                    loose not equality operator
                    this only compares the values
                3. > 
                    compares the left operand is greater than the right operand
                4. <
                    
                5. >=
                6. <=
                7. ===
                    strict equality operator
                    this compares the value along with datatypes
                    console.log(10 === "10") // false
                8. !==
                    strinct not equal

            4. Logical Operators
                1. ||
                    logical OR 
                2. &&
                    Logical AND
                3. !
                    logical NOT
                4. ??
                    nullish coalsing operators
                    if any of its operands are null or undefined then return the right

                    let name;
                    console.log(name ?? "user")
