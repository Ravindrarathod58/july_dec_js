    <!-- 
    
        Types of functions

        1. Named Function
            named functions are declared using the names / identifier
            function myFunction(){} // named function
        2.  Anonymous function
            a function without name
            function(){} // anonymous
        3. Arrow function
            arrow functions are declared using the special syntax
            => // arrow
            we don to write the function keyword to declare the arrow functions

    function scope
        variable environment
            - stores the function varible
        lexical environment   
            - holds the reference of outer scope 
    

    global object
        Window
    
    1. Closure
        we can return any function from another functions
        when the outer function completes its execution but the inner function still 
        holds the reference of the varibles from its outer scope

        To achive the encapsulation in Object based programming

    2. HOF
        higher order function
            the function which takes another function as parameter or returns a function

    3. IIFE
        immediently invoked function expression
        when we have to create a complete private scope

    4. constructor function
        using the constructor function we can create the objects
        using the new keyword

    5. callback function
        a function passed as parameter to another function to execute later




        diffrence between named function , anonymous function and arrow function

        named function
            - it has the name
            - we can create the objects using new keyword
            - it has its own this

        anonymous function
            - it dont have a name
            - mostly used as the object methods
            - it also has its own this
        arrow function
            - it has the special syntax =>
            - we can avoid the {} and return statement if we have a single line to execute
            - mostly used as callback function
            - it dont have its own this it referes the this from its outer scope
            - mostly used as object methods



    


    let a = 10;
    let b = 20;

    function addition(){
        return a + b;
    }

    const addition = () => a + b;
