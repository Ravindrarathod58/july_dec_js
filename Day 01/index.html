            how to write and excute the javascript programs

            1. using the browser
                ways of writing the javascript
                    1. inline javascript
                            with the help of attributes
                            1. global attribute -> id, class, title
                            2. element specific attributes -> href, alt, src, type, name
                            3. boolean attributes -> required, readonly, disabled
                            4. event attributes -> onclick onsubmit
                              the attributes who allows to track the user actions

                    2. internal javascript
                       with the  script tag we can write the javascript code
                       the script tag must be always at the bottom of HTML code

                    3. external js
                        1. create a separate file with the .js extension
                        2. inside the HTML use the script tag and src attribute to link the javascript and HTML
                            press the right button of the mouse on the browser screen
                            select inspect option from the menu
                            select the console tab



            2. using node js

                    1. install the node.js
                    2. verify

                    5. use the command node filename to execute the program

            console.table() -> to display the objects( array, object, map , set)
